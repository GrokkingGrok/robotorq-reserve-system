[workspace]
members = [
	"crates/commons",
	"crates/robot-gateway",
	"crates/examples"
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["RoboTorq Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2.0.17"
time = { version = "0.3", features = ["macros", "serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

