[workspace]
members = [
	"crates/commons",
	"crates/examples",
	"crates/cargo-robotorq-migrate"
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["RoboTorq Contributors"]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
blake3 = "1.8.2"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["macros", "serde"] }
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros"] }

# Workspace pins for OpenTelemetry family to avoid mixed-version issues
tracing-opentelemetry = "0.24"
opentelemetry = "0.23"
opentelemetry-otlp = "0.16"
opentelemetry-sdk = "0.23"



