# RoboTorq Reserve System Configuration
# Updated configuration format for the new architecture

schema_version = 1

# Set to "simulation" for development/testing, "production" for live operation
mode = "production"

[simulation]
# Simulation parameters (only used when mode = "simulation")
enabled = false
random_seed = 42
in_simulation_hours = 8760  # One year
speedup = 1000.0
network_latency_ms = 0

# Robot gateway simulation settings
robot_gateway_robot_initial_count = 5
robot_gateway_robot_count_growth_rate = 0.1
robot_gateway_max_robot_count = 100

[ports]
# Network port assignments for all services
robot_gateway_port = 9000
metrics_port = 8005
grafana_port = 8015

# Legacy configuration (deprecated - will be migrated)
[orchestration]
nats_url = "nats://localhost:4222"
prometheus_bind = "0.0.0.0:9091"

[robot]
robot_id = "auto"
klipper_url = "http://printer.local:7125"
moonraker_url = "http://printer.local:7125"
power_sensor = "ina219"

[refinery]
ingot_size = 3600

[mint]
certificate_ingots = 1000
# Persistence backend selection:
# - "sqlite" (default): uses local file DB, e.g. sqlite://robotorq.db
# - "postgres": uses a Postgres server via DATABASE_URL
# Switch by setting `persistence.backend = "postgres"` and `DATABASE_URL`.

[persistence]
# Backend: "sqlite" or "postgres"
backend = "sqlite"
# SQLite file path used when backend = "sqlite"
sqlite_url = "sqlite://robotorq.db"
# Optional migration tracking table
migration_table = "_robotorq_migrations"

# When backend = "postgres", set DATABASE_URL env var, e.g.:
#   postgres://user:pass@host:5432/dbname
# You can also set here if preferred:
# postgres_url = "postgres://postgres:postgres@127.0.0.1:5432/postgres"
