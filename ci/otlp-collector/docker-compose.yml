version: '3.7'
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.79.0
    container_name: otel-collector
    volumes:
      - ./config.yaml:/etc/otel/config.yaml:ro
    command: ["--config", "/etc/otel/config.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: "no"
