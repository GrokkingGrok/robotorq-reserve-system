# .github/workflows/ci.yml — FIXED
name: CI/CD

on:
  push:
    branches: [ v0 ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: docker compose build --parallel    # ← CHANGED: space, not hyphen

      - name: Test Mint
        run: |
          docker compose up -d mint nats        # ← CHANGED
          sleep 10
          curl -f http://localhost:8080/health || exit 1

      - name: Test Oracle
        run: |
          docker compose up -d oracle            # ← CHANGED
          sleep 10
          curl -f http://localhost:8081/health || exit 1

      - name: Test Wallet
        run: |
          docker compose up -d wallet            # ← CHANGED
          sleep 30
          curl -f http://localhost:3000 || exit 1