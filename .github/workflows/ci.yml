# .github/workflows/ci.yml — Full CI with Docker services + Digger (Tauri)
name: CI/CD

on:
  push:
    branches: [ main, v0, feature/* ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      # ── Checkout source code ─────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Set up Go 1.25+ ─────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # ── Docker Buildx (for all services) ────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build all Docker images in parallel ─────────────────────
      - name: Build all Docker images
        run: docker compose build --parallel

      # ── Test Mint ───────────────────────────────────────────────
      - name: Test Mint
        run: |
          docker compose up -d mint nats
          sleep 10
          curl -f http://localhost:8080/health || exit 1

      - name: Clean up Mint
        if: always()
        run: docker compose down --volumes

      # ── Test Refinery ───────────────────────────────────────────
      - name: Test Refinery
        run: |
          docker compose up -d refinery
          sleep 10
          curl -f http://localhost:8081/health || exit 1

      - name: Clean up Refinery
        if: always()
        run: docker compose down --volumes

      # ── Test Wallet ─────────────────────────────────────────────
      - name: Test Wallet
        run: |
          docker compose up -d nats mint wallet
          sleep 30
          curl -f http://localhost:8085/health || exit 1

      - name: Clean up Wallet
        if: always()
        run: docker compose down --volumes

      # ── Test DistoDam ───────────────────────────────────────────
      - name: Test DistoDam
        run: |
          docker compose up -d nats distodam
          sleep 10
          curl -f http://localhost:8082/health || exit 1

      - name: Clean up DistoDam
        if: always()
        run: docker compose down --volumes

      # ── Test Trust ──────────────────────────────────────────────
      - name: Test Trust
        run: |
          docker compose up -d nats trust
          sleep 10
          curl -f http://localhost:8083/health || exit 1

      - name: Clean up Trust
        if: always()
        run: docker compose down --volumes

      # ── Test Digger (uses pre-built Docker image) ──────────────
      - name: Test Digger
        run: |
          docker compose up -d digger nats
          sleep 15
          curl -f http://localhost:3030/health || exit 1

      - name: Clean up Digger
        if: always()
        run: docker compose down --volumes
      
      # ── Final success ────────────────────────────────────────
      - name: All tests passed
        run: echo "All services and Digger App are healthy!"
  # ── Create GitHub Issues from TODO comments ───────────────────────────────
  todo:
    name: Create TODO Issues
    runs-on: ubuntu-latest
    # Remove `needs: build` — let it run independently
    permissions:
      issues: write      # Can create/close issues
      contents: read     # Can read code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create TODO Issues
        uses: alstr/todo-to-issue-action@v4
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABELS: "todo,enhancement"
          CLOSE_ISSUES: true
          AUTO_ASSIGN: false
          COMMENT_MARKER: "TODO"
          UNIQUE: true
          INCLUDE_FILE_PATH: true
          INCLUDE_LINE_NUMBER: true