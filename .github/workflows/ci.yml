# .github/workflows/ci.yml — Full CI with Docker services + Digger (Tauri)
name: CI/CD

on:
  push:
    branches: [ main, v0, feature/* ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      # ── Checkout source code ─────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Set up Go 1.25+ ─────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # ── Docker Buildx (for all services) ────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build all Docker images in parallel ─────────────────────
      - name: Build all Docker images
        run: docker compose build --parallel

      # ── Test Mint ───────────────────────────────────────────────
      - name: Test Mint
        run: |
          docker compose up -d mint nats
          sleep 10
          curl -f http://localhost:8080/health || exit 1

      - name: Clean up Mint
        if: always()
        run: docker compose down --volumes

      # ── Test Refinery ───────────────────────────────────────────
      - name: Test Refinery
        run: |
          docker compose up -d refinery
          sleep 10
          curl -f http://localhost:8081/health || exit 1

      - name: Clean up Refinery
        if: always()
        run: docker compose down --volumes

      # ── Test Wallet ─────────────────────────────────────────────
      - name: Test Wallet
        run: |
          docker compose up -d wallet
          sleep 30
          curl -f http://localhost:3000 || exit 1

      - name: Clean up Wallet
        if: always()
        run: docker compose down --volumes

      # ── Test DistoDam ───────────────────────────────────────────
      - name: Test DistoDam
        run: |
          docker compose up -d nats distodam
          sleep 10
          curl -f http://localhost:8082/health || exit 1

      - name: Clean up DistoDam
        if: always()
        run: docker compose down --volumes

      # ── Test Trust ──────────────────────────────────────────────
      - name: Test Trust
        run: |
          docker compose up -d nats trust
          sleep 10
          curl -f http://localhost:8083/health || exit 1

      - name: Clean up Trust
        if: always()
        run: docker compose down --volumes

      # ── Setup Rust & Node for Digger (Tauri) ───────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/digger-app/digger/package-lock.json
      # ── Linux system deps for Tauri (GTK, WebKit, etc.) ────────
      - name: Install Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            pkg-config \
            build-essential \
            curl

      # ── Cache Cargo (registry + build) ────────────────────────
      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # ── Install Tauri CLI ─────────────────────────────────────
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --force

      # ── Build Digger App (headless) ───────────────────────────
      - name: Build Digger App
        working-directory: ./src/digger-app/digger
        run: |
          npm install
          cargo tauri build

      # ── Upload Linux .deb artifact ───────────────────────────
      - name: Upload Digger Linux build
        uses: actions/upload-artifact@v4
        with:
          name: digger-app-linux
          path: src/digger-app/digger/src-tauri/target/release/bundle/deb/*.deb
      
      # ── Final success ────────────────────────────────────────
      - name: All tests passed
        run: echo "All services and Digger App are healthy!"
  # ── Create GitHub Issues from TODO comments ───────────────────────────────
  todo:
    name: Create TODO Issues
    runs-on: ubuntu-latest
    # Remove `needs: build` — let it run independently
    permissions:
      issues: write      # Can create/close issues
      contents: read     # Can read code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create TODO Issues
        uses: alstr/todo-to-issue-action@v4
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABELS: "todo,enhancement"
          CLOSE_ISSUES: true
          AUTO_ASSIGN: false
          COMMENT_MARKER: "TODO"
          UNIQUE: true
          INCLUDE_FILE_PATH: true
          INCLUDE_LINE_NUMBER: true