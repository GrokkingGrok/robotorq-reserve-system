name: OTLP E2E (manual)

on:
  workflow_dispatch:

jobs:
  otlp-e2e:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run OTLP precheck script
        env:
          RUST_LOG: info
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
        run: |
          python3 scripts/run_otlp_precheck.py --verbose

      - name: Upload collector logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otel-collector-logs
          path: otel-collector.log

      - name: Tear down collector
        if: always()
        run: |
          docker ps -q --filter "name=otel-collector" | xargs -r docker stop
