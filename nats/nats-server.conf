# NATS Server Configuration
# Purpose: Configure NATS server with increased max payload for large Phase2 ingot batches

# Network settings
port: 4222
http_port: 8222

# JetStream
jetstream: enabled

# Max payload size: 10MB (default is 1MB)
# Phase2 ingot batches can contain hundreds of ingots with merkle trees
max_payload: 10485760

# Logging
debug: false
trace: false
logtime: true
