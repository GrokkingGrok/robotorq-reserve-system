[package]
name = "robot-gateway"
version = "0.0.1"
edition = "2024"

[lib]
name = "robot_gateway"
path = "src/lib.rs"

[dependencies]
commons = { path = "../commons", default-features = false }
tracing = "0.1.41"
dotenvy = "0.15"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "signal"] }
prometheus = "0.14.0"
