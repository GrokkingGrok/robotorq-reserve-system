[package]
name = "commons"
version = "0.0.1"
edition = "2024"

[features]
default = []
sim = []
persistence = ["sqlx"]
messaging = ["async-nats"]
otlp = ["tracing-opentelemetry", "opentelemetry", "opentelemetry-otlp"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
uuid.workspace = true
thiserror.workspace = true
time.workspace = true
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2.3"
prometheus = "0.14.0"
axum = "0.8.7"
tower = "0.5.2"
tower-http = { version = "0.6.7", features = ["cors", "trace", "timeout", "limit"] }
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "signal"] }

# Optional dependencies for error conversions and later persistence/messaging integrations
sqlx = { version = "0.7", optional = true, default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite"] }
async-nats = { version = "0.32", optional = true }

# Optional OTLP/tracing integration (feature-gated because it pulls in native exporters)
tracing-opentelemetry = { version = "0.20", optional = true }
opentelemetry = { version = "0.20", optional = true }
opentelemetry-otlp = { version = "0.16", optional = true }

[dev-dependencies]
# No cross-crate test deps to avoid duplicate commons versions

