[package]
name = "commons"
version = "0.0.1"
edition = "2024"

[features]
default = []
sim = []
persistence = ["sqlx"]
persistence-postgres = ["sqlx"]
persistence-testcontainers = []
messaging = ["async-nats"]
otlp = ["tracing-opentelemetry", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk"]
test_helpers = []
dev = ["test_helpers", "persistence", "dev-tools/dev"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
uuid.workspace = true
thiserror.workspace = true
time.workspace = true
toml = "0.9.8"
tracing = "0.1.41"
async-trait = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2.3"
prometheus = "0.14.0"
axum = "0.8.7"
tower = "0.5.2"
tower-http = { version = "0.6.7", features = ["cors", "trace", "timeout", "limit"] }
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "signal"] }
rand = { version = "0.9.2", features = ["std"] }

# Optional dependencies for error conversions and later persistence/messaging integrations
sqlx = { version = "0.8.6", optional = true, default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite"] }
async-nats = { version = "0.45.0", optional = true }

# Optional OTLP/tracing integration (feature-gated because it pulls in native exporters)
tracing-opentelemetry = { version = "0.24", optional = true }
# Align OTLP crates to workspace pins. Use opentelemetry SDK crate for runtime features.
opentelemetry = { version = "0.23", optional = true, features = ["trace"] }
opentelemetry_sdk = { version = "0.23", optional = true, package = "opentelemetry_sdk", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.16", optional = true, features = ["tonic", "trace"] }

# Optional workspace-level dev-tools crate to provide a single `--features dev` UX.
dev-tools = { path = "../dev-tools", optional = true }



[dev-dependencies]
# No cross-crate test deps to avoid duplicate commons versions
futures = "0.3"
# Enable image helpers (postgres, etc.) exported by testcontainers
testcontainers = "0.26.0" # No features needed here
testcontainers-modules = { version = "0.14.0", features = ["postgres"] }

