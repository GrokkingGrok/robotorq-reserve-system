syntax = "proto3";

package robotorq-economy.v0;

message BRLA {
  string id = 1;
  string builder_id = 2;
  uint64 ttp_required = 3;
  uint64 duration_hours = 4;
  repeated string skills = 5;
}

message ProofRequest {
  string brla_id = 1;
}

message ProofResponse {
  string brla_id = 1;
  bool verified = 2;
  bytes signature = 3;
}
