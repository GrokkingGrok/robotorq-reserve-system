[package]
name = "robotorq-vault"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "robotorq_vault"
path = "src/lib.rs"

[[bin]]
name = "vault"
path = "src/main.rs"

[[bin]]
name = "test_publisher"
path = "test_publisher.rs"

authors = ["RoboTorq"]

[dependencies]
anyhow = "1.0"
thiserror = "2.0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-nats = "0.45.0"
dashmap = "6.1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
futures-util = "0.3"
