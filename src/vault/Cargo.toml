[package]
name = "robotorq-vault"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "robotorq_vault"
path = "src/lib.rs"

[[bin]]
name = "vault"
path = "src/main.rs"

[[bin]]
name = "test_publisher"
path = "test_publisher.rs"

authors = ["RoboTorq"]

[dependencies]
anyhow = "1.0"
thiserror = "2.0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-nats = "0.45.0"
dashmap = "6.1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
futures-util = "0.3"
axum = { version = "0.8.7", features = ["macros"] }
prometheus = "0.14"
tokio-postgres = { version = "0.7", features = ["with-uuid-0_8"] }
deadpool-postgres = "0.14"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
openssl = { version = "0.10", features=["vendored"], optional=true }
sha256 = "1.5"
pqcrypto-falcon = { version = "0.4", optional = true }
common = { path = "../common" }

[features]
default = []
crypto = ["dep:openssl", "dep:pqcrypto-falcon"]
simulation = []

[dev-dependencies]
criterion = "0.5"
