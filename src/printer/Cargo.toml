[package]
name = "printer"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-nats = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto dependencies (shared with Digger)
oqs = "0.10"
sha2 = "0.10"
hex = "0.4"

# Prometheus metrics
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.4"
warp = "0.3"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"
