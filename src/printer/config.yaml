# Printer Service Configuration

# Printer identification
printer_id: "ender3-v3-ke-001"
printer_model: "Ender3V3KE"
rated_watts: 350  # Certified power capacity

# Network configuration
nats_url: "nats://localhost:4222"
klipper_url: "http://localhost:7125"  # Moonraker API endpoint

# Mock mode - for testing without real printer
mock_mode: true  # Set to false when connecting real printer

# Service configuration
heartbeat_interval_secs: 10
metrics_port: 9091

# Logging
log_level: "info"  # trace, debug, info, warn, error
