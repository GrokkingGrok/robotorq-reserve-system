[package]
name = "rust-trust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
async-nats = "0.45.0"
prometheus = "0.14.0"
futures = "0.3"
hyper = { version = "0.14", features = ["full"] }
once_cell = "1.18"

[features]
simulation = []

[dev-dependencies]
tempfile = "3.0"
