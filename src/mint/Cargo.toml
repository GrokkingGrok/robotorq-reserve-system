[package]
name = "mint"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-nats = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
# oqs = "0.9"  # TODO: Add back when crypto is implemented
tracing = "0.1"
tracing-subscriber = "0.3"