[package]
name = "mint"
version = "0.1.0"
edition = "2024"

[features]
# Retain simulation; crypto now lives in common crate.
simulation = []

[[bin]]
name = "mint"

[dependencies]
anyhow = "1.0"
async-nats = "0.45.0"
async-trait = "0.1.89"
futures = "0.3.31"
futures-util = "0.3.31"
hex = "0.4.3"
prometheus = "0.14.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
uuid = { version = "1.18.1", features = ["v4"] }

# Crypto dependencies (optional)
common = { path = "../common" }