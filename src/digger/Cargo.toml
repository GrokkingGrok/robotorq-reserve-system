[package]
name = "digger"
version = "0.2.0"
edition = "2024"
authors = ["RoboTorq Project"]
description = "Pure backend Digger - JTU generation and storage"

[lib]
name = "digger"
path = "src/lib.rs"

[[bin]]
name = "digger"
path = "src/main.rs"

[dependencies]
# HTTP Server
axum = "0.8.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.37.0", features = ["bundled"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# NATS
async-nats = "0.45.0"

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Metrics
prometheus = "0.13"

# Post-Quantum Cryptography (Phase 4)
pqcrypto-falcon = "0.4.1"
pqcrypto-traits = "0.3"

# Parallel processing
rayon = "1.10"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-test = "0.4"
tempfile = "3.14"
num_cpus = "1.16"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
