[package]
name = "wallet"
version = "0.1.0"
edition = "2024"
authors = ["RoboTorq Project"]
description = "RoboTorq Wallet Service - Tracks RoboTorq unit balances"

[[bin]]
name = "wallet"
path = "src/main.rs"

[dependencies]
# HTTP Server
axum = "0.8.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# NATS Client
async-nats = "0.45.0"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Metrics
prometheus = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenvy = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# HTTP Client for Mint verification
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
