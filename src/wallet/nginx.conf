# -------------------------------
# Nginx global settings
# -------------------------------
events {}
# Required block for Nginx, even if empty.
# Controls how Nginx handles connections; default is usually fine for small static sites.

http {
    # -------------------------------
    # Server configuration
    # -------------------------------
    server {
        listen 0.0.0.0:3000;           # ← CRITICAL
        # Listen on all network interfaces on port 3000.
        # Matches the port exposed by the Docker container.

        server_name localhost;
        # Default server name; only important for virtual hosting scenarios.

        root /usr/share/nginx/html;
        # Serve static files from this directory (matches Docker COPY destination).

        index index.html;
        # Default file to serve when accessing the root directory.

        # -------------------------------
        # Root location for the app
        # -------------------------------
        location / {
            try_files $uri $uri/ =404;
            # Serve the requested file if it exists; otherwise return 404.
            # Ensures Nginx doesn’t silently redirect missing files.
        }

        # -------------------------------
        # WASM-specific configuration
        # -------------------------------
        location /pkg/ {
            add_header Content-Type application/wasm;
            # Ensure WASM files have the correct MIME type for browsers.

            add_header Cross-Origin-Opener-Policy same-origin;
            add_header Cross-Origin-Embedder-Policy require-corp;
            # Required for SharedArrayBuffer support in WASM threads.
            # Ensures the site is cross-origin isolated.

            # Optional improvement: caching
            # Uncomment to enable long-term caching of WASM files for performance.
            # expires 1y;
            add_header Cache-Control "public, immutable";
            gzip on;
            gzip_types application/wasm;
            expires 1y;
        }

        # -------------------------------
        # Health endpoint for Docker
        # -------------------------------
        location /health {
            return 200 "ok";
            # Respond with HTTP 200 and a simple message for health checks.

            access_log off;
            # Disable logging for health check requests to reduce log noise.
        }

        # -------------------------------
        # Optional improvements
        # -------------------------------
        # 1. Compression for WASM/JS/HTML/CSS
        #    location ~* \.(html|css|js|wasm)$ {
        #        gzip on;
        #        gzip_types text/plain text/css application/javascript application/wasm;
        #    }
        #
        # 2. Security headers (CSP, HSTS)
        #    add_header X-Content-Type-Options nosniff;
        #    add_header X-Frame-Options SAMEORIGIN;
        #    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        #
        # 3. Error pages for better UX
        #    error_page 404 /index.html;
    }
}
