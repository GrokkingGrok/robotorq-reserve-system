[package]
name = "digger"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "digger"

[lib]
name = "digger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Main Tauri GUI application
[[bin]]
name = "digger"
path = "src/main.rs"

# Headless binary for E2E testing (no GUI/Tauri overhead)
[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }
pqcrypto-internals = "0.2.6"

[dependencies]
tauri = { version = "2.9", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"  # Only if you still use it — otherwise remove
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1.4"
base64 = "0.22"
env_logger = "0.11.8"
log = "0.4"
pqcrypto-traits = "0.3.5"
pqcrypto-dilithium = "0.5.0"
tiny_http = "0.12"
reqwest = { version = "0.11", features = ["json", "blocking"] }
