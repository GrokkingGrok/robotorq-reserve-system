# docker-compose.yml — FIXED
version: "3.8"

services:
  mint:
    build: ./src/mint
    ports:
      - "50051:50051"
      - "8080:8080"
    depends_on:
      - nats
      - postgres
    networks:
      - torqnet

  oracle:
    build: ./src/oracle
    ports:
      - "50052:50052"
      - "8081:8080"
    depends_on:
      - nats
      - mint
    volumes:
      - ./proofs:/proofs
    networks:
      - torqnet

  wallet:
    build: ./src/wallet
    ports:
      - "3000:3000"
    depends_on:
      - nats
    networks:
      - torqnet

  nats:
    image: nats:alpine
    command: "--js"
    ports:
      - "4222:4222"
    networks:
      - torqnet

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: torq
      POSTGRES_PASSWORD: torqpass
      POSTGRES_DB: roboTorq
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - torqnet

# FIXED: This was missing '-'
volumes:
  pg-data:

networks:
  torqnet:
