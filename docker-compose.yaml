# docker-compose.yml — WORKING ON WINDOWS
# Purpose: Defines all services, networks, and volumes for local development/testing.
# Prometheus + Grafana monitoring integrated for distodam & trust metrics.

x-build-args: &build-args
  # Prevent parallel builds from overwhelming Docker Hub rate limits
  max-parallel: 2

services:
  # -----------------------------
  # NATS (Messaging Broker)
  # -----------------------------
  nats:
    build:
      context: .
      dockerfile: ./nats/Dockerfile.nats.cli
    command:
      - "-c"
      - "/nats/nats-server.conf"
    volumes:
      - ./nats:/nats:ro
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - torqnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # -----------------------------
  # PostgreSQL Database
  # -----------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: torq
      POSTGRES_PASSWORD: torqpass
      POSTGRES_DB: roboTorq
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - torqnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torq -d roboTorq"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------
  # Mint Service
  # -----------------------------
  mint:
    build: ./src/mint
    ports:
      - "50051:50051"
      - "8080:8080"
      - "8084:8081"  # Phase 5: Verification API (host:8084 -> container:8081)
      - "9090:9090"
    environment:
      - HTTP_PORT=8080
      - NATS_URL=nats://nats:4222
      - BATCH_SIZE=1000  # Phase3 units require exactly 1000 Phase2Ingots
      - FLUSH_INTERVAL=60s
      - BUFFER_CAPACITY=100000
      - NATS_RETRIES=3
      - NATS_BACKOFF_BASE=100ms
      - LOG_LEVEL=info
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - torqnet

  # -----------------------------
  # Digger Service (Rust - Falcon-1024 Crypto)
  # -----------------------------
  digger:
    build:
      context: ./src/digger
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    environment:
      - DIGGER_ID=digger-dev-001
      - NATS_URL=nats://nats:4222
      - HTTP_PORT=3030
      - STORAGE_PATH=/app/jtu_storage
      - BATCH_INTERVAL_SEC=5  # Send ore batches every 5s (balanced with Refinery 10s)
      - LOG_LEVEL=info
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - ./src/digger/jtu_storage:/app/jtu_storage
    networks:
      - torqnet

  # -----------------------------
  # Printer Service (3D Printer Mock)
  # -----------------------------
  printer:
    build:
      context: ./src/printer
      dockerfile: Dockerfile
    ports:
      - "9094:9091"  # Metrics port (avoid conflict with Prometheus on 9091)
      - "9092:9092"  # Mock API port
    environment:
      - PRINTER_ID=test-printer-001
      - NATS_URL=nats://nats:4222
      - DIGGER_URL=http://digger:3030
      - MOCK_MODE=true
      - PRINTER_MODEL=Ender3V3KE
      - RATED_WATTS=350
      - LOG_LEVEL=info
    depends_on:
      nats:
        condition: service_healthy
      digger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - ./src/printer/data:/app/data  # Certificate storage
    networks:
      - torqnet

  # -----------------------------
  # Refinery Service
  # -----------------------------
  refinery:
    build: ./src/refinery
    ports:
      - "50052:50052"
      - "8081:8080"
    environment:
      - NATS_URL=nats://nats:4222
      - REFINERY_INGOT_BATCH_INTERVAL=5  # Send ingot batches every 5s (match Digger interval)
      - MINT_MAX_RETRIES=3
      - MINT_BASE_DELAY=1
      - REFINERY_JOULE_QUEUE_SIZE=7500  # Larger buffer for high-throughput testing
      - REFINERY_ROBO_QUEUE_SIZE=7500  # Larger buffer for high-throughput testing
      - SKIP_FALCON_VERIFICATION=true  # Testing: disable Falcon signature verification
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - ./proofs:/proofs
    networks:
      - torqnet

  # -----------------------------
  # Wallet Service
  # -----------------------------
  wallet:
    build: ./src/wallet
    ports:
      - "8085:8080"  # Expose wallet API on host port 8085
    environment:
      - NATS_URL=nats://nats:4222
      - HTTP_PORT=8080
      - RUST_LOG=wallet=info,tower_http=info
      - MINT_VERIFICATION_URL=http://mint:8081/verify/certificate
    depends_on:
      nats:
        condition: service_healthy
      mint:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - torqnet

  # -----------------------------
  # DistoDam Service
  # -----------------------------
  distodam:
    build:
      context: ./src
      dockerfile: ./distodam/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - NATS_URL=nats://nats:4222
      - PORT=8082
      - WALLET_DISTRIBUTION_ENABLED=true
      - WALLET_DISTRIBUTION_RT_PER_MIN=100.0
      - WALLET_ACTIVATION_TOPIC=wallet.activate
      - WALLET_DISTRIBUTION_TOPIC=wallet.distribution
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - torqnet

  # -----------------------------
  # Trust Service
  # -----------------------------
  trust:
    build:
      context: ./src
      dockerfile: ./trust/Dockerfile
    ports:
      - "8083:8080"
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - torqnet

  # -----------------------------
  # Prometheus (Metrics Collector)
  # -----------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"  # Changed to avoid conflict with Mint on 9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml   # 👈 Use your existing root file
    networks:
      - torqnet
    depends_on:
      - distodam
      - trust
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped


  # -----------------------------
  # Grafana (Metrics Dashboard)
  # -----------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"   # Changed to avoid conflict with Digger on 3030
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - torqnet
    depends_on:
      - prometheus
    restart: unless-stopped

# -----------------------------
# Named Volumes
# -----------------------------
volumes:
  pg-data:
  grafana-data:

# -----------------------------
# Networks
# -----------------------------
networks:
  torqnet:
    driver: bridge
