# docker-compose.yml — WORKING ON WINDOWS
# Purpose: Defines all services, networks, and volumes for local development/testing.
# Prometheus + Grafana monitoring integrated for distodam & trust metrics.

x-build-args: &build-args
  # Prevent parallel builds from overwhelming Docker Hub rate limits
  max-parallel: 2

services:
  # -----------------------------
  # NATS (Messaging Broker)
  # -----------------------------
  nats:
    build:
      context: .
      dockerfile: ./nats/Dockerfile.nats.cli
    command: >-
      --jetstream
      --http_port 8222
      -m 8222
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - torqnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # -----------------------------
  # PostgreSQL Database
  # -----------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: torq
      POSTGRES_PASSWORD: torqpass
      POSTGRES_DB: roboTorq
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - torqnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torq -d roboTorq"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------
  # Mint Service
  # -----------------------------
  mint:
    build: ./src/mint
    ports:
      - "50051:50051"
      - "8080:8080"
      - "9090:9090"
    environment:
      - HTTP_PORT=8080
      - NATS_URL=nats://nats:4222
      - BATCH_SIZE=1000
      - FLUSH_INTERVAL=60s
      - BUFFER_CAPACITY=100000
      - NATS_RETRIES=3
      - NATS_BACKOFF_BASE=100ms
      - LOG_LEVEL=info
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - torqnet

  # -----------------------------
  # Digger Service (Rust - Falcon-1024 Crypto)
  # -----------------------------
  digger:
    build:
      context: ./src/digger
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    environment:
      - DIGGER_ID=digger-dev-001
      - NATS_URL=nats://nats:4222
      - HTTP_PORT=3030
      - STORAGE_PATH=/app/jtu_storage
      - BATCH_INTERVAL_SEC=5
      - LOG_LEVEL=info
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - ./src/digger/jtu_storage:/app/jtu_storage
    networks:
      - torqnet

  # -----------------------------
  # Refinery Service
  # -----------------------------
  refinery:
    build: ./src/refinery
    ports:
      - "50052:50052"
      - "8081:8080"
    environment:
      - NATS_URL=nats://nats:4222
      - REFINERY_INGOT_BATCH_INTERVAL=60
      - MINT_MAX_RETRIES=3
      - MINT_BASE_DELAY=1
      - REFINERY_JOULE_QUEUE_SIZE=5000
      - REFINERY_ROBO_QUEUE_SIZE=5000
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - ./proofs:/proofs
    networks:
      - torqnet

  # -----------------------------
  # Wallet Service
  # -----------------------------
  wallet:
    build: ./src/wallet
    ports:
      - "3000:3000"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - torqnet

  # -----------------------------
  # DistoDam Service
  # -----------------------------
  distodam:
    build:
      context: ./src
      dockerfile: ./distodam/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - NATS_URL=nats://nats:4222
      - PORT=8082
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - torqnet

  # -----------------------------
  # Trust Service
  # -----------------------------
  trust:
    build:
      context: ./src
      dockerfile: ./trust/Dockerfile
    ports:
      - "8083:8080"
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - torqnet

  # -----------------------------
  # Prometheus (Metrics Collector)
  # -----------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"  # Changed to avoid conflict with Mint on 9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml   # 👈 Use your existing root file
    networks:
      - torqnet
    depends_on:
      - distodam
      - trust
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped


  # -----------------------------
  # Grafana (Metrics Dashboard)
  # -----------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"   # Changed to avoid conflict with Digger on 3030
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - torqnet
    depends_on:
      - prometheus
    restart: unless-stopped

# -----------------------------
# Named Volumes
# -----------------------------
volumes:
  pg-data:
  grafana-data:

# -----------------------------
# Networks
# -----------------------------
networks:
  torqnet:
    driver: bridge
