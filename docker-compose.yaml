# docker-compose.yml — WORKING ON WINDOWS
# Purpose: Defines all services, networks, and volumes for local development/testing.
# Prometheus + Grafana monitoring integrated for distodam & trust metrics.

services:
  # -----------------------------
  # NATS (Messaging Broker)
  # -----------------------------
  nats:
    build:
      context: .
      dockerfile: ./nats/Dockerfile.nats.cli
    command: >-
      --jetstream
      --http_port 8222
      -m 8222
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - torqnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # -----------------------------
  # PostgreSQL Database
  # -----------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: torq
      POSTGRES_PASSWORD: torqpass
      POSTGRES_DB: roboTorq
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - torqnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torq -d roboTorq"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------
  # Mint Service
  # -----------------------------
  mint:
    build: ./src/mint
    ports:
      - "50051:50051"
      - "8080:8080"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health", "--spider"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - torqnet

  # -----------------------------
  # Refinery Service
  # -----------------------------
  refinery:
    build: ./src/refinery
    ports:
      - "50052:50052"
      - "8081:8080"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - ./proofs:/proofs
    networks:
      - torqnet

  # -----------------------------
  # Wallet Service
  # -----------------------------
  wallet:
    build: ./src/wallet
    ports:
      - "3000:3000"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - torqnet

  # -----------------------------
  # DistoDam Service
  # -----------------------------
  distodam:
    build: ./src/distodam
    ports:
      - "8082:8080"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - torqnet

  # -----------------------------
  # Trust Service
  # -----------------------------
  trust:
    build: ./src/trust
    ports:
      - "8083:8080"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - torqnet

  # -----------------------------
  # Prometheus (Metrics Collector)
  # -----------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml   # 👈 Use your existing root file
    networks:
      - torqnet
    depends_on:
      - distodam
      - trust
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped


  # -----------------------------
  # Grafana (Metrics Dashboard)
  # -----------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3030:3000"   # 👈 Changed host port from 3000 → 3030
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - torqnet
    depends_on:
      - prometheus
    restart: unless-stopped

# -----------------------------
# Named Volumes
# -----------------------------
volumes:
  pg-data:
  grafana-data:

# -----------------------------
# Networks
# -----------------------------
networks:
  torqnet:
    driver: bridge
